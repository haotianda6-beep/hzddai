services:
  nofx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    image: nofx-trading:${HZ_QA_IMAGE_TAG:-hz-qa}
    container_name: nofx-hz-qa
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${HZ_QA_ENV_FILE:?set HZ_QA_ENV_FILE}:/app/.env:ro
      - ${HZ_QA_DATA_DIR:?set HZ_QA_DATA_DIR}:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ${HZ_QA_ENV_FILE:?set HZ_QA_ENV_FILE}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_TYPE: sqlite
      DB_PATH: /app/data/data.db
      EXPERIENCE_IMPROVEMENT: "false"
      HTTP_PROXY: http://172.19.0.1:17898
      HTTPS_PROXY: http://172.19.0.1:17898
      ALL_PROXY: http://172.19.0.1:17898
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,nofx,nofx-frontend}
    depends_on:
      hz-egress-relay:
        condition: service_started
    networks:
      - hz-qa
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    image: nofx-frontend:${HZ_QA_IMAGE_TAG:-hz-qa}
    container_name: nofx-hz-qa-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HZ_QA_LISTEN_ADDRESS:-0.0.0.0}:${HZ_QA_FRONTEND_PORT:-13000}:80"
    networks:
      - hz-qa
    depends_on:
      nofx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 5s

  hz-egress-relay:
    image: alpine/socat:latest
    container_name: nofx-hz-qa-egress-relay
    restart: unless-stopped
    network_mode: host
    command:
      - TCP-LISTEN:17898,bind=172.19.0.1,fork,reuseaddr
      - TCP:127.0.0.1:17897

networks:
  hz-qa:
    name: comkun-hz-qa
