# nginx.conf - Extracted Nginx configuration for NOFX Frontend
# This configuration merges enhancements from provided variants: improved gzip, static asset caching, adjusted API proxy (preserving /api/ path), extended timeouts, and a static health response for frontend independence.

server {
    listen 80;
    server_name localhost;

    # Frontend root
    root /usr/share/nginx/html;
    index index.html;

    # 热点静态文件元数据缓存，减轻磁盘 stat / 打开开销（二次访问同一资源更快）
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_errors off;

    # 主包在 /assets：开启 gzip（体积通常降为原来的 ~25–35%，首屏明显更快）。
    # 若外层 CDN 再次出现 CONTENT_LENGTH / CHUNKED 异常，可在此 location 改回 gzip off。
    # X-Accel-Buffering: no —— 提醒外层 Nginx 勿整段缓冲导致截断。
    location ^~ /assets/ {
        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_comp_level 5;
        gzip_types application/javascript text/css application/json application/manifest+json;
        sendfile on;
        tcp_nopush on;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Accel-Buffering no always;
        try_files $uri =404;
    }

    # 慢链路 / 外层代理：拉长发送超时，避免大 JS/CSS 传到一半被掐断
    send_timeout 600s;

    # 其余文本资源（非 /assets 命中时）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # index.html — 绝不缓存壳子，确保每次拿到最新 asset 哈希
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 根目录等处的 .js（非 /assets），仍 gzip；不存在时返回清缓存脚本
    location ~* \.(?:js|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /asset-reload.js;
    }

    # 静态资源单独匹配，勿嵌套在 location / 内：部分 nginx 下嵌套会导致静态资源被回退成 index.html。
    location ~* \.(?:css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA：非静态文件回退到 index.html（壳子同样不可长期缓存）
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # 邀请返利管理后台（宿主机 uvicorn 8099）。勿写在 location / 之后，否则会被 SPA 吃掉。
    # 容器内需配置 extra_hosts: host.docker.internal → host-gateway（见 docker-compose.yml）
    location ^~ /hongzhong {
        proxy_pass http://host.docker.internal:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # API 必须用 ^~，否则下方正则 location 会抢走「以 .js 等结尾」的接口路径
    location ^~ /api/ {
        proxy_pass http://nofx:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeout for long-running API calls
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health check endpoint (static response for frontend health, independent of backend)
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}