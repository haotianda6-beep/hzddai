services:
  # Backend service (API and core logic)
  nofx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-trading
    restart: unless-stopped
    stop_grace_period: 30s  # Allow the app 30 seconds for graceful shutdown
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
      - "6060:6060"  # pprof profiling
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
      # 策略市场详情演示叠加（详见 api/strategy_market_detail_demo.go）；1=启用虚拟汇总，0=真实数据
      - NOFX_MARKET_DETAIL_DEMO=${NOFX_MARKET_DETAIL_DEMO:-0}
      # 交易员数据看板演示（详见 api/trader_dashboard_demo.go）；1=对 NOFX_TRADER_DEMO_IDS 中的 trader_id 返回虚拟曲线/汇总
      - NOFX_TRADER_DASHBOARD_DEMO=${NOFX_TRADER_DASHBOARD_DEMO:-0}
      - NOFX_TRADER_DEMO_IDS=${NOFX_TRADER_DEMO_IDS:-}
      # 多个 Binance 账号临时共用本机出口时，轻量平滑直连 REST；长等待会让已签名请求过期。
      - BINANCE_DIRECT_REST_MIN_INTERVAL_MS=${BINANCE_DIRECT_REST_MIN_INTERVAL_MS:-1000}
      - BINANCE_BLOCK_DIRECT_REST=${BINANCE_BLOCK_DIRECT_REST:-1}
      - BINANCE_FUTURES_WEIGHT_SOFT=${BINANCE_FUTURES_WEIGHT_SOFT:-900}
      - BINANCE_FUTURES_WEIGHT_HARD=${BINANCE_FUTURES_WEIGHT_HARD:-1200}
      # 邀请返利 Python 服务（个人中心展示返佣/划转）；与返利端 PLATFORM_SYNC_SECRET 一致
      - AGENT_REBATE_BASE_URL=${AGENT_REBATE_BASE_URL:-}
      - AGENT_REBATE_PLATFORM_SECRET=${AGENT_REBATE_PLATFORM_SECRET:-}
    networks:
      - nofx-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
      args:
        VITE_CRISP_WEBSITE_ID: ${VITE_CRISP_WEBSITE_ID:-}
        VITE_TAWK_PROPERTY_ID: ${VITE_TAWK_PROPERTY_ID:-}
        VITE_TAWK_WIDGET_ID: ${VITE_TAWK_WIDGET_ID:-}
        VITE_LIVECHAT_IFRAME_URL: ${VITE_LIVECHAT_IFRAME_URL:-}
    container_name: nofx-frontend
    restart: unless-stopped
    # 反代 /hongzhong → 宿主机返利服务 :8099（见 nginx.conf）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    networks:
      - nofx-network
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    driver: bridge
