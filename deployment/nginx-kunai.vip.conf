# 主机 Nginx：把域名 kunai.vip 反代到本机 Docker 前端（默认 3000）
# 主站管理后台：https://kunai.vip/admin ；邀请返佣 Python 服务需另开端口或 location 反代（见 deployment/nginx-kunai-vio-rebate-split.example.conf）
# 用法：复制到 /etc/nginx/sites-available/kunai.vip 并启用站点，再 certbot 申请证书。
# 原理：浏览器只访问域名；Nginx 把请求转给 nofx-frontend 容器里的 Nginx，由容器内再把 /api 转到后端。
# 说明：若 DNS 未配置 www.kunai.vip，server_name 里不要写 www，否则 Let's Encrypt 校验会失败。

server {
    listen 80;
    listen [::]:80;
    server_name kunai.vip;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 64m;
    }
}
