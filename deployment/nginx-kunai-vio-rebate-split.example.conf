# 示例：同一域名下，主站 + 邀请返佣（Python agent_rebate_backend，默认监听 8099）
# 返佣管理页路径：/hongzhong/login（服务内 ADMIN_WEB_PREFIX=/hongzhong）
#
# 用法：合并进现有站点 server { }，调整端口与 upstream。
#
# location 顺序建议：更具体的 ^~ /hongzhong 写在通用 location / 之前。

server {
    listen 443 ssl http2;
    server_name kunai.vio;

    # ssl_certificate ...

    # 邀请返佣 FastAPI（萤火主题管理看板）
    location ^~ /hongzhong {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 主站前端（nofx-frontend，默认 3000）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
